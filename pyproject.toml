[project]
name = "pydhn"
version = "0.2.0"
description = "A library for the simulation of district heating networks."
authors = [
	{ name = "Roberto Boghetti", email = "roberto.boghetti@idiap.ch" },
	{ name = "Giuseppe Peronato", email = "giuseppe.peronato@idiap.ch" },
]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
dependencies = [
	"numpy>=1.25.2,<3",
	"scipy>=1.11.2,<2",
	"networkx>=2.6,<4",
	"matplotlib>=3.7.2,<4",
	"pandas>=2.0.3,<3",
	"geopandas>=0.13.2,<0.14",
	"plotly>=5.16.1,<6",
]
# Let Poetry add the classifiers of the supported Python versions
dynamic = ["classifiers"]

[project.urls]
homepage = "https://www.github.com/idiap/pydhn"
repository = "https://www.github.com/idiap/pydhn"

[tool.poetry.group.dev.dependencies]
coverage = "^7.3.0"
openpyxl = "^3.1.2"
sphinx = "^7.3.7"
sphinx_rtd_theme = "^2.0.0"
pre-commit = "^3.0.0"

[tool.isort]
skip = ["__init__.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
